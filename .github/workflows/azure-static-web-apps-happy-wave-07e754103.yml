name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Write version files
        run: |
          VERSION=$(jq -r .version package.json)
          printf '%s' "$VERSION" > public/function-app/version.txt
          printf '{"version":"%s"}' "$VERSION" > public/version.json
      - name: Bundle PowerShell modules into function app
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $dest = "public/function-app/Modules"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Save-Module -Name Az.Accounts      -MinimumVersion '3.0.0' -MaximumVersion '3.99.99' -Path $dest -Force
          Save-Module -Name Az.Compute       -MinimumVersion '8.0.0' -MaximumVersion '8.99.99' -Path $dest -Force
          Save-Module -Name Az.ResourceGraph -MinimumVersion '1.0.0' -MaximumVersion '1.99.99' -Path $dest -Force
          Write-Host "Modules bundled:"
          Get-ChildItem $dest | Select-Object Name
      - name: Package function app
        run: cd public/function-app && zip -r ../function-app.zip .
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_WAVE_07E754103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_WAVE_07E754103 }}
          action: "close"
          app_location: "/"
